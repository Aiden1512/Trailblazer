/husky1/mission_manager:
  ros__parameters:
    use_sim_time: true
    waypoints_file: "/home/stella/Trailblazer/trail_decision_making/config/recorded_trail_paths.yaml"
    global_frame: "husky1_map"
    robot_frame: "husky1_base_link"
    nav_action_name: "navigate_to_pose"
    obstacle_wait_sec: 4.0
    auto_start: false   # true = start without waiting for the GUI's start button (/husky1/start_mission)
    backtrack_on_obstacle: true   # true = mark a blocked trail and go back to the previous junction; false = Nav2 plans around the obstacle
    home_x: 6.5   # where the robot parks once every reachable trail is inspected
    home_y: 4.0
